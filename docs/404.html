<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
        // For GitHub Pages SPA: preserve original pathname and redirect
        var path = window.location.pathname;
        var hash = window.location.hash;
        var search = window.location.search;
        
        // Store the original pathname in sessionStorage so React Router can use it
        if (path !== '/' && path !== '/index.html') {
            sessionStorage.setItem('ghp_redirect_path', path);
            sessionStorage.setItem('ghp_redirect_search', search);
            sessionStorage.setItem('ghp_redirect_hash', hash);
        }
        
        // Redirect to index.html - React Router will handle the routing
        window.location.replace('/index.html' + hash);
    </script>
</head>
<body>
<p>Redirecting...</p>
</body>
</html>
